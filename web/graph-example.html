<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>moondsp — external graph example</title>
  <style>
    :root { color-scheme: light; background: #f3efe5; color: #1d1b18; font-family: system-ui, sans-serif; }
    body { max-width: 70ch; margin: 0 auto; padding: 32px 20px; line-height: 1.6; }
    h1 { font-size: 1.8rem; line-height: 1.2; text-wrap: balance; }
    label { display: block; font-weight: 600; margin-top: 24px; }
    textarea { box-sizing: border-box; width: 100%; min-height: 260px; padding: 12px; background: #fffcf5; color: inherit; border: 1px solid #81766a; border-radius: 6px; font: 0.9rem/1.5 monospace; resize: vertical; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
    button { font: inherit; padding: 8px 16px; min-height: 44px; border: 1px solid #81766a; border-radius: 6px; background: #fffcf5; color: inherit; cursor: pointer; }
    button:hover:not(:disabled) { background: #e8c2a2; }
    button:disabled { opacity: 0.55; cursor: default; }
    :focus-visible { outline: 3px solid #b44f2c; outline-offset: 3px; }
    ::selection { background: #e8c2a2; }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>External graph example</h1>
  <p>This page defines its own mono graph and uses only <code>graph-engine.js</code>.
    Mount before playback. Start at a low device volume.</p>
  <label for="graph">Graph description</label>
  <textarea id="graph" spellcheck="false">{"nodes":[
  {"type":"oscillator","waveform":"triangle","frequency":220},
  {"type":"gain","input":0,"gain":0.1},
  {"type":"output","input":1}
]}</textarea>
  <div class="actions">
    <button id="mount">Mount graph</button>
    <button id="play" disabled>Play</button>
    <button id="pause" disabled>Pause</button>
    <button id="unmount" disabled>Unmount</button>
  </div>
  <p id="status" role="status" aria-live="polite">No graph mounted.</p>
  <p>Pause preserves phase. Unmount also closes this example's engine; mounting again creates a new engine.</p>
  <script type="module">
    import { createGraphEngine } from './graph-engine.js';
    const description = document.querySelector('#graph');
    const status = document.querySelector('#status');
    const mount = document.querySelector('#mount');
    const play = document.querySelector('#play');
    const pause = document.querySelector('#pause');
    const unmount = document.querySelector('#unmount');
    let context, engine, source;
    const report = error => { status.textContent = `${error.code ?? error.name}: ${error.message}`; };
    // Each resource gets a cleanup attempt; the original failure wins.
    const closeExample = async error => {
      play.disabled = pause.disabled = unmount.disabled = true;
      try { await source?.unmount(); } catch (cause) { error ??= cause; }
      try { await engine?.close(); } catch (cause) { error ??= cause; }
      try {
        if (context && context.state !== 'closed') await context.close();
      } catch (cause) { error ??= cause; }
      engine = source = context = null;
      description.disabled = mount.disabled = false;
      return error;
    };
    mount.onclick = async () => {
      mount.disabled = true;
      status.textContent = 'Mounting graph…';
      try {
        const graph = JSON.parse(description.value);
        context = new AudioContext();
        await context.suspend();
        engine = await createGraphEngine({ context });
        source = await engine.mount(graph);
        engine.output.connect(context.destination);
        description.disabled = true;
        play.disabled = unmount.disabled = false;
        status.textContent = 'Mounted. Select Play to begin.';
      } catch (error) {
        report(await closeExample(error));
      }
    };
    play.onclick = async () => {
      play.disabled = true;
      try {
        await context.resume();
        await source.play();
        pause.disabled = false;
        status.textContent = 'Playing.';
      } catch (error) { play.disabled = false; report(error); }
    };
    pause.onclick = async () => {
      try {
        await source.pause();
        pause.disabled = true;
        play.disabled = false;
        status.textContent = 'Paused.';
      } catch (error) { report(error); }
    };
    unmount.onclick = async () => {
      const error = await closeExample();
      if (error) report(error);
      else status.textContent = 'Unmounted. You can mount another graph in a new engine.';
    };
  </script>
</body>
</html>
